<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunflower Web | سەنفلاوەر وێب 🌻| Links</title>
    <style>
        :root {
            --primary-color: #FFD700; /* Sunflower Yellow */
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        p {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 30px;
        }
        .links-container {
            width: 100%;
            max-width: 400px;
        }
        .link-card {
            background: #2a2a2a;
            display: block;
            text-align: center;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .link-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-color);
            background: #333;
        }
        .instagram { border-right: 5px solid #E1306C; }
        .tiktok { border-right: 5px solid #000000; }
        .telegram { border-right: 5px solid #0088cc; }
        
        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Sunflower Web Logo" class="profile-img">

    <h1>Sunflower Web | سەنفلاوەر وێب 🌻</h1>
    <p>گەشە بکە، فێر ببە، دروست بکە 🚀</p>

    <div class="links-container">
        <a href="https://www.instagram.com/sunflowerweb.iq" class="link-card instagram" target="_blank">Instagram | ئینستاگرام</a>
        <a href="https://www.tiktok.com/@sunflowerweb.iq" class="link-card tiktok" target="_blank">TikTok | تیکتۆک</a>
        <a href="https://t.me/sunflowerwebiq" class="link-card telegram" target="_blank">Telegram | تلگرام</a>
    </div>

    <div class="footer">
        بنیاتنراوە لەلایەن Sunflower Web 🌻 2026
    </div>

</body>
</html>
